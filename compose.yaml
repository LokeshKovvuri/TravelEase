services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelease
      POSTGRES_USER: travelease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelease -d travelease"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://travelease:${POSTGRES_PASSWORD:-change-me}@database:5432/travelease
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
